services:
  - type: web
    name: finance-guru-api
    runtime: python
    rootDir: fastapi
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: AUTH_SECRET
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: LLM_PROVIDER
        value: demo
      - key: LLM_API_KEY
        sync: false
      - key: LLM_API_URL
        sync: false
      - key: LLM_API_MODEL
        sync: false

  - type: static_site
    name: finance-guru-frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: build
    envVars:
      - key: REACT_APP_API_URL
        sync: false
